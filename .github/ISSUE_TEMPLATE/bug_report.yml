name: Bug report
description: Report a reproducible defect in PewwTerm
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues
        first and include enough detail to reproduce the problem.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: I ran `pewwterm --check` and included its output below.
          required: true
        - label: This is not a security vulnerability (see SECURITY.md).
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behaviour and why it is wrong.
      placeholder: The preview panel stays on the previous file after...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence of actions that triggers the bug.
      placeholder: |
        1. Run `pewwterm ~/Videos`
        2. Select `clip.mp4`
        3. Press ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: The new preview should appear...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PewwTerm and Python versions
      description: Output of `pewwterm --version` and `python --version`.
      placeholder: pewwterm 0.1.0, Python 3.14.5
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Arch Linux
        - Other Linux
        - Other (not officially supported)
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal and size
      description: Terminal emulator, multiplexer and approximate columns x rows.
      placeholder: tmux 3.5 in foot, 120x40
    validations:
      required: true

  - type: textarea
    id: dependency-check
    attributes:
      label: Dependency check
      description: Paste the complete output of `pewwterm --check`.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Traceback or tool output
      description: Paste relevant errors. Remove private paths and filenames.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private filenames, paths, logs and secrets from this report.
          required: true
