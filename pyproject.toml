[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pewwterm"
version = "0.1.0"
description = "A keyboard-driven multimedia file explorer for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PewwTerm contributors" }]
keywords = ["tui", "terminal", "file-manager", "multimedia", "textual"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = [
  "textual>=8.0,<9",
  "rich>=13",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
pewwterm = "pewwterm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pewwterm"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
